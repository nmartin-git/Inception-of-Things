apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iot-app-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/nmartin-git/Inception-of-Things.git'
    targetRevision: feat/13-app-deployment-argocd
    path: './p3/confs'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true